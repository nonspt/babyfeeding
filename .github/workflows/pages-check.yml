name: Verify published PWA
on:
  push:
    branches: [pages-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed resources
        run: |
          set -euo pipefail
          url=https://nonspt.github.io/babyfeeding
          curl --fail --silent --show-error "$url/" | grep '悦见成长' > /dev/null
          curl --fail --silent --show-error "$url/src/app.js" | grep 'previewOnly:false' > /dev/null
          curl --fail --silent --show-error "$url/sw.js" | grep 'care-shell-v10' > /dev/null
          curl --fail --silent --show-error "$url/manifest.webmanifest" | node -e "let t='';process.stdin.on('data',x=>t+=x);process.stdin.on('end',()=>{let v=JSON.parse(t);if(v.start_url!=='./'||v.scope!=='./')process.exit(1)})"
          curl --fail --silent --show-error --head "$url/sync/controller.mjs" | tr -d '\\r' | grep -Ei '^content-type: (text|application)/(javascript|ecmascript)' > /dev/null
          echo 'Published PWA resources passed'
